services:
  postgres:
    image: postgres:16-alpine
    container_name: jt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: talentio
      POSTGRES_PASSWORD: talentio
      POSTGRES_DB: job_talentio
    ports:
      - "5434:5432"
    volumes:
      - jt_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talentio -d job_talentio"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: jt-redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    volumes:
      - jt_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: jt-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - jt_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: jt-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/job-talentio || true;
      mc anonymous set download local/job-talentio/public || true;
      exit 0;
      "

  mailpit:
    image: axllent/mailpit:latest
    container_name: jt-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  jt_pg_data:
  jt_redis_data:
  jt_minio_data:
