<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4f46e5" />
    <title>Job Talentio</title>
    <style>
      body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f6f8fb; color: #0f172a; display: grid; min-height: 100vh; place-items: center; padding: 1.5rem; box-sizing: border-box; }
      .card { background: #fff; border-radius: 16px; padding: 1.5rem; max-width: 420px; box-shadow: 0 8px 30px rgba(15, 23, 42, 0.08); text-align: center; }
      .logo { width: 64px; height: 64px; border-radius: 16px; margin: 0 auto 1rem; }
      h1 { font-size: 1.15rem; margin: 0 0 0.5rem; }
      p { margin: 0.35rem 0; color: #475569; line-height: 1.5; }
      button { margin-top: 1rem; background: #4f46e5; color: #fff; border: 0; border-radius: 10px; padding: 0.65rem 1.2rem; font-size: 1rem; cursor: pointer; }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="logo" src="/icons/icon-192.png" alt="" />
      <h1>Internet aloqasi yo'q</h1>
      <p>Job Talentio ochilishi uchun internet kerak. Aloqa tiklangach qayta urinib ko'ring.</p>
      <p lang="ru">Нет подключения к интернету. Повторите попытку, когда связь восстановится.</p>
      <p lang="en">You are offline. Try again once the connection is back.</p>
      <button type="button" onclick="location.reload()">Qayta urinish</button>
    </main>
  </body>
</html>
