# Railway service: web
# Set root directory to monorepo root in the Railway dashboard.
# Dockerfile path: apps/web/Dockerfile
# Pass NEXT_PUBLIC_* as Docker build args / Railway variables (available at build time).

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/web/Dockerfile"
watchPatterns = ["apps/web/**", "packages/shared/**", "package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml"]

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
