# Install only after the loopback services pass verification and cutover is approved.
# Replaces /etc/nginx/sites-available/cari-kerja; never restore legacy proxies.
server {
    listen 80;
    server_name cari-kerja.co.id www.cari-kerja.co.id api.cari-kerja.co.id su-stage.cari-kerja.co.id;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name www.cari-kerja.co.id;
    ssl_certificate /etc/letsencrypt/live/cari-kerja.co.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cari-kerja.co.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    return 301 https://cari-kerja.co.id$request_uri;
}
server {
    listen 443 ssl;
    server_name cari-kerja.co.id;
    ssl_certificate /etc/letsencrypt/live/cari-kerja.co.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cari-kerja.co.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    client_max_body_size 20m;
    add_header X-Talentio-Deployment indonesia-vps always;
    location ~ /\.(?!well-known/) { deny all; }
    location / {
        proxy_pass http://127.0.0.1:13000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
server {
    listen 443 ssl;
    server_name api.cari-kerja.co.id;
    ssl_certificate /etc/letsencrypt/live/cari-kerja.co.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cari-kerja.co.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    client_max_body_size 20m;
    add_header X-Talentio-Deployment indonesia-vps always;
    location ~ /\.(?!well-known/) { deny all; }
    location /api/ {
        proxy_pass http://127.0.0.1:14000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location /socket.io/ {
        proxy_pass http://127.0.0.1:14000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
    # Only Talentio's new bucket is exposed. Private CVs require signed URLs.
    location /talentio/ {
        proxy_pass http://127.0.0.1:19000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }
    location / { return 404; }
}
server {
    listen 443 ssl;
    server_name su-stage.cari-kerja.co.id;
    ssl_certificate /etc/letsencrypt/live/su-stage.cari-kerja.co.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/su-stage.cari-kerja.co.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    add_header X-Talentio-Deployment indonesia-vps always;
    location ~ /\.(?!well-known/) { deny all; }
    location / {
        proxy_pass http://127.0.0.1:13001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
# Retired legacy frontend/backend hostnames must never reach the old app.
server {
    listen 80;
    server_name fe-stage.cari-kerja.co.id be-stage.cari-kerja.co.id;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 410; }
}
server {
    listen 443 ssl;
    server_name fe-stage.cari-kerja.co.id be-stage.cari-kerja.co.id;
    ssl_certificate /etc/letsencrypt/live/cari-kerja.co.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cari-kerja.co.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    return 410;
}
