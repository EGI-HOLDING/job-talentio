map $http_cf_connecting_ip $jt_forwarded_for {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

server {
    listen 80;
    listen [::]:80;
    server_name staging.jobtalent.io api-staging.jobtalent.io admin-staging.jobtalent.io files-staging.jobtalent.io;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name staging.jobtalent.io;

    ssl_certificate /etc/ssl/jobtalent/origin.crt;
    ssl_certificate_key /etc/ssl/jobtalent/origin.key;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3018;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $jt_forwarded_for;
        proxy_set_header X-Forwarded-For $jt_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api-staging.jobtalent.io;

    ssl_certificate /etc/ssl/jobtalent/origin.crt;
    ssl_certificate_key /etc/ssl/jobtalent/origin.key;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:4018;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $jt_forwarded_for;
        proxy_set_header X-Forwarded-For $jt_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin-staging.jobtalent.io;

    ssl_certificate /etc/ssl/jobtalent/origin.crt;
    ssl_certificate_key /etc/ssl/jobtalent/origin.key;

    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3019;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $jt_forwarded_for;
        proxy_set_header X-Forwarded-For $jt_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name files-staging.jobtalent.io;

    ssl_certificate /etc/ssl/jobtalent/origin.crt;
    ssl_certificate_key /etc/ssl/jobtalent/origin.key;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:9102;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $jt_forwarded_for;
        proxy_set_header X-Forwarded-For $jt_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
